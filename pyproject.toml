[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evcycle"
version = "1.0.0"
description = "Route-based electric-vehicle driving-cycle generation with explicit traffic, grade, and uncertainty assumptions"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Masoud Masih-Tehrani", email = "masih@iust.ac.ir" },
]
keywords = [
  "electric vehicle",
  "driving cycle",
  "routing",
  "road grade",
  "uncertainty quantification",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "click>=8.1",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=1.5",
  "requests>=2.31",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[project.scripts]
evcycle = "evcycle.cli:main"

[project.urls]
Homepage = "https://github.com/Meqdad82/EVCycle2"
Repository = "https://github.com/Meqdad82/EVCycle2"
Issues = "https://github.com/Meqdad82/EVCycle2/issues"

[tool.setuptools.packages.find]
include = ["evcycle*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]